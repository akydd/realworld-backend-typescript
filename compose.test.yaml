services:
  test_db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: test-app-ts
    volumes:
      - app-ts-test-data:/var/lib/postgres
    ports:
      - 8094:5432

volumes:
  app-ts-test-data:
